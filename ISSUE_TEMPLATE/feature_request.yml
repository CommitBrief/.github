name: Feature request
description: Suggest a new capability or improvement for a CommitBrief repository.
title: "[Feature]: "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement.

        CommitBrief is an opinionated, closed-source product. We may decline requests that fall outside the engineering-intelligence scope, even if they are individually reasonable. The clearer the underlying problem, the easier it is to evaluate.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the underlying need, not a specific solution. What can you not do today?
      placeholder: There is no way to distinguish between security findings that affect the data plane and those that affect the control plane when scoring impact.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Outline how you would solve the problem. Reference relevant components, data models, or pipeline stages if you can.
      placeholder: Add an additional dimension to the scoring engine for surface-of-impact, populated by the Gatekeeper LLM and stored on event_scores.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you rejected them. "None" is rarely the right answer.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which area of CommitBrief does this affect?
      options:
        - Ingestion / source registry
        - Deterministic filtering
        - Gatekeeper LLM
        - Canonical event builder
        - Source clustering
        - Signal scoring
        - Localization
        - Editorial review
        - Distribution (X / LinkedIn / Newsletter)
        - Observability / monitoring
        - Infrastructure / deployment
        - Cross-cutting (specify in proposal)
    validations:
      required: true

  - type: dropdown
    id: urgency
    attributes:
      label: How time-sensitive is this?
      options:
        - Blocking current work
        - Needed for an upcoming initiative
        - Nice to have
        - Just an idea
    validations:
      required: true

  - type: textarea
    id: success
    attributes:
      label: What does success look like?
      description: How would you know this feature is working as intended? What metric, output, or behavior would change?
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I have read the [Code of Conduct](https://github.com/CommitBrief/.github/blob/main/CODE_OF_CONDUCT.md).
          required: true
